<style>
  :root{--bg:#f6f7f9;--card:#fff;--text:#1a1d21;--muted:#667085;--line:#e4e7ec;--accent:#2563eb;--accent2:#1d4ed8;--err:#b42318;--errbg:#fef3f2;--ok:#067647;--okbg:#ecfdf3;--checker:#e4e7ec}
  @media(prefers-color-scheme:dark){:root{--bg:#101418;--card:#1a1f26;--text:#f2f4f7;--muted:#98a2b3;--line:#2e3642;--accent:#5b8cff;--accent2:#7aa5ff;--err:#fda29b;--errbg:#3a1512;--ok:#6ce9a6;--okbg:#052e1b;--checker:#2e3642}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
  main{max-width:980px;margin:0 auto;padding:24px 16px 64px}
  h1{font-size:24px;margin:8px 0 4px}
  .sub{color:var(--muted);margin:0 0 8px}
  .privacy{background:#ecfdf3;border:1px solid #a6f4c5;color:#067647;border-radius:10px;padding:10px 14px;font-size:14px;margin:16px 0}
  @media(prefers-color-scheme:dark){.privacy{background:#052e1b;border-color:#14532d;color:#6ce9a6}}
  .topbar{display:flex;align-items:flex-start;gap:12px}
  .topbar>div:first-child{flex:1}
  .lang-toggle{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-shrink:0;margin-top:10px}
  .lang-toggle button{border:0;background:var(--card);color:var(--muted);padding:7px 14px;cursor:pointer;font-size:14px;min-height:36px}
  .lang-toggle button.active{background:var(--accent);color:#fff}
  .tabs{display:flex;gap:8px;margin:20px 0 12px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 18px;border-radius:999px;cursor:pointer;font-size:15px;min-height:44px}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .panel{display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
  .panel.active{display:block}
  .cols{display:grid;grid-template-columns:1fr;gap:20px}
  @media(min-width:860px){.cols{grid-template-columns:minmax(0,1fr) 340px}.preview-col{position:sticky;top:16px;align-self:start}}
  .pills{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
  .pill{border:1px solid var(--line);background:var(--bg);color:var(--text);padding:8px 13px;border-radius:999px;cursor:pointer;font-size:13.5px;min-height:38px}
  .pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .form{display:none}
  .form.active{display:block}
  label{display:block;font-weight:600;font-size:14px;margin:12px 0 0}
  label:first-child{margin-top:0}
  input[type=text],input[type=password],input[type=email],input[type=tel],input[type=number],input[type=datetime-local],textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font-size:15px;margin:6px 0 4px;min-height:44px}
  textarea{resize:vertical;min-height:64px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:520px){.row2{grid-template-columns:1fr}}
  .hint{font-size:13px;color:var(--muted);margin:2px 0 0;min-height:18px}
  .check{display:flex;align-items:center;gap:10px;font-weight:400;font-size:14px;padding:10px 0;cursor:pointer;margin:0}
  .check input{width:20px;height:20px;accent-color:var(--accent);flex-shrink:0}
  .settings{border-top:1px solid var(--line);margin-top:18px;padding-top:6px}
  .settings h3{font-size:14px;margin:14px 0 4px;color:var(--muted);letter-spacing:.02em}
  .color-row{display:flex;gap:12px;flex-wrap:wrap}
  .color-field{flex:1;min-width:130px}
  .color-field input[type=color]{width:100%;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:4px;cursor:pointer;margin:6px 0 0}
  input[type=range]{width:100%;accent-color:var(--accent);min-height:36px}
  .range-val{font-weight:400;color:var(--muted);font-size:13px}
  .preview-box{border:1px solid var(--line);border-radius:12px;min-height:280px;display:flex;align-items:center;justify-content:center;padding:20px;background:repeating-conic-gradient(var(--checker) 0% 25%, var(--card) 0% 50%) 0 0/22px 22px;overflow:hidden}
  .qr-wrap{display:flex;flex-direction:column;align-items:center;max-width:100%}
  .qr-caption{margin-top:10px;font-size:14px;line-height:1.45;text-align:center;word-break:break-word;overflow-wrap:anywhere;max-width:264px;white-space:pre-wrap}
  .preview-box canvas,.preview-box svg{max-width:100%;height:auto;display:block}
  .preview-box svg{width:100%}
  .placeholder{color:var(--muted);font-size:14px;text-align:center;padding:12px}
  .msg{font-size:14px;min-height:20px;margin-top:12px;white-space:pre-wrap;border-radius:8px}
  .msg.error{color:var(--err);background:var(--errbg);padding:9px 12px}
  .msg.note{color:var(--ok);background:var(--okbg);padding:9px 12px}
  .msg:empty{padding:0}
  .dl-row{display:flex;gap:10px;margin-top:14px}
  .btn{background:var(--accent);color:#fff;border:0;padding:12px 18px;border-radius:10px;font-size:15px;cursor:pointer;flex:1;min-height:48px}
  .btn:hover{background:var(--accent2)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--line)}
  .payload{font-size:12px;color:var(--muted);word-break:break-all;margin-top:10px;max-height:64px;overflow:auto}
  footer{color:var(--muted);font-size:13px;margin-top:24px;line-height:1.7}
  .copyright{color:var(--muted);font-size:13px;margin-top:10px}
  .trademark{color:var(--muted);font-size:12px;margin-top:6px;line-height:1.6}
  button,[role="button"],select,summary,input:not([type="checkbox"],[type="radio"]){min-height:2rem}
  .bulk-h{font-size:14px;color:var(--muted);margin:2px 0 6px;letter-spacing:.02em}
  input[type=file]{width:100%;padding:10px;border:1px dashed var(--line);border-radius:8px;background:var(--card);color:var(--text);font-size:14px;margin:6px 0 4px;min-height:44px}
  .bulk-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}
  .bulk-table-wrap:empty{border:0;margin:0}
  table.bulk{border-collapse:collapse;width:100%;font-size:13px}
  table.bulk th,table.bulk td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  table.bulk th{color:var(--muted);font-weight:600;white-space:nowrap}
  table.bulk td.v{word-break:break-all;max-width:280px}
  .st-ok{color:var(--ok);font-weight:600;white-space:nowrap}
  .st-bad{color:var(--err)}
  #sheetArea{margin-top:20px}
  #sheetArea:empty{display:none}
  .sheet-scroll{margin:0 auto 18px;max-width:720px}
  .sheet{background:#fff;color:#111;width:100%;aspect-ratio:210/297;position:relative;border:1px solid var(--line);box-shadow:0 2px 14px rgba(0,0,0,.08);container-type:inline-size}
  .sheet-cell{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1cqw;overflow:hidden}
  .sheet-cell .imgwrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
  .sheet-cell img{max-width:100%;max-height:100%;display:block}
  .sheet-cell .cap{font-size:1.9cqw;line-height:1.3;text-align:center;word-break:break-all;max-height:2.6em;overflow:hidden;margin-top:.6cqw}
  @page{size:A4;margin:0}
  @media print{
    body{background:#fff}
    body *{visibility:hidden}
    #sheetArea,#sheetArea *{visibility:visible}
    #sheetArea{position:absolute;left:0;top:0;width:100%;margin:0}
    .sheet-scroll{max-width:none;margin:0;page-break-after:always}
    .sheet-scroll:last-child{page-break-after:auto}
    .sheet{width:210mm;height:297mm;aspect-ratio:auto;border:0;box-shadow:none;margin:0}
  }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div>
      <h1 data-i18n="appName"></h1>
      <p class="sub" data-i18n="tagline"></p>
    </div>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button type="button" id="langEn">EN</button>
      <button type="button" id="langJa">日本語</button>
      <button type="button" id="langTh">ไทย</button>
    </div>
  </div>
  <div class="privacy" data-i18n="privacy"></div>

  <div class="tabs">
    <button class="tab active" data-tab="qrPanel" data-i18n="tabQr"></button>
    <button class="tab" data-tab="bcPanel" data-i18n="tabBarcode"></button>
    <button class="tab" data-tab="bulkPanel" data-i18n="tabBulk"></button>
  </div>

  <!-- ============ QR ============ -->
  <section class="panel active" id="qrPanel">
    <div class="cols">
      <div>
        <div class="pills" id="qrTypePills"></div>

        <div class="form active" id="form-text">
          <label for="qText" data-i18n="fText"></label>
          <textarea id="qText" data-i18n-ph="fTextPh"></textarea>
          <p class="hint" data-i18n="fTextHint"></p>
        </div>

        <div class="form" id="form-wifi">
          <label for="qWifiSsid" data-i18n="fSsid"></label>
          <input type="text" id="qWifiSsid" autocomplete="off">
          <label for="qWifiPass" data-i18n="fPassword"></label>
          <input type="text" id="qWifiPass" autocomplete="off">
          <div class="row2">
            <div>
              <label for="qWifiEnc" data-i18n="fEncryption"></label>
              <select id="qWifiEnc">
                <option value="WPA">WPA / WPA2 / WPA3</option>
                <option value="WEP">WEP</option>
                <option value="nopass" data-i18n="fNoPass"></option>
              </select>
            </div>
            <div>
              <label class="check" style="margin-top:34px"><input type="checkbox" id="qWifiHidden"><span data-i18n="fHidden"></span></label>
            </div>
          </div>
        </div>

        <div class="form" id="form-vcard">
          <div class="row2">
            <div><label for="qVcLast" data-i18n="fLastName"></label><input type="text" id="qVcLast" autocomplete="family-name"></div>
            <div><label for="qVcFirst" data-i18n="fFirstName"></label><input type="text" id="qVcFirst" autocomplete="given-name"></div>
          </div>
          <label for="qVcOrg" data-i18n="fOrg"></label>
          <input type="text" id="qVcOrg" autocomplete="organization">
          <label for="qVcTitle" data-i18n="fTitle"></label>
          <input type="text" id="qVcTitle">
          <div class="row2">
            <div><label for="qVcPhone" data-i18n="fPhone"></label><input type="tel" id="qVcPhone" autocomplete="tel"></div>
            <div><label for="qVcEmail" data-i18n="fEmail"></label><input type="email" id="qVcEmail" autocomplete="email"></div>
          </div>
          <label for="qVcUrl" data-i18n="fUrl"></label>
          <input type="text" id="qVcUrl" inputmode="url">
          <label for="qVcAddr" data-i18n="fAddress"></label>
          <input type="text" id="qVcAddr" autocomplete="street-address">
        </div>

        <div class="form" id="form-email">
          <label for="qMailTo" data-i18n="fMailTo"></label>
          <input type="email" id="qMailTo">
          <label for="qMailSubject" data-i18n="fSubject"></label>
          <input type="text" id="qMailSubject">
          <label for="qMailBody" data-i18n="fBody"></label>
          <textarea id="qMailBody"></textarea>
        </div>

        <div class="form" id="form-phone">
          <label for="qPhoneNum" data-i18n="fPhoneNum"></label>
          <input type="tel" id="qPhoneNum" data-i18n-ph="fPhonePh">
          <p class="hint" data-i18n="fPhoneHint"></p>
        </div>

        <div class="form" id="form-sms">
          <label for="qSmsNum" data-i18n="fPhoneNum"></label>
          <input type="tel" id="qSmsNum" data-i18n-ph="fPhonePh">
          <label for="qSmsMsg" data-i18n="fMessage"></label>
          <textarea id="qSmsMsg"></textarea>
        </div>

        <div class="form" id="form-geo">
          <div class="row2">
            <div><label for="qGeoLat" data-i18n="fLat"></label><input type="number" step="any" id="qGeoLat" placeholder="35.6812"></div>
            <div><label for="qGeoLng" data-i18n="fLng"></label><input type="number" step="any" id="qGeoLng" placeholder="139.7671"></div>
          </div>
          <label for="qGeoQuery" data-i18n="fPlaceName"></label>
          <input type="text" id="qGeoQuery">
          <p class="hint" data-i18n="fGeoHint"></p>
        </div>

        <div class="form" id="form-event">
          <label for="qEvTitle" data-i18n="fEvTitle"></label>
          <input type="text" id="qEvTitle">
          <div class="row2">
            <div><label for="qEvStart" data-i18n="fEvStart"></label><input type="datetime-local" id="qEvStart"></div>
            <div><label for="qEvEnd" data-i18n="fEvEnd"></label><input type="datetime-local" id="qEvEnd"></div>
          </div>
          <label for="qEvLoc" data-i18n="fEvLoc"></label>
          <input type="text" id="qEvLoc">
          <label for="qEvDesc" data-i18n="fBody"></label>
          <textarea id="qEvDesc"></textarea>
        </div>

        <div class="settings">
          <h3 data-i18n="design"></h3>
          <div class="color-row">
            <div class="color-field">
              <label for="qrFg" data-i18n="fgColor"></label>
              <input type="color" id="qrFg" value="#1a1d21">
            </div>
            <div class="color-field">
              <label for="qrBg" data-i18n="bgColor"></label>
              <input type="color" id="qrBg" value="#ffffff">
            </div>
          </div>
          <label class="check"><input type="checkbox" id="qrBgTrans"><span data-i18n="transparent"></span></label>
          <label class="check"><input type="checkbox" id="qrShowText"><span data-i18n="showQrText"></span></label>
          <div id="qrCaptionWrap" style="display:none">
            <label for="qrCaption" data-i18n="qrCaptionLabel"></label>
            <input type="text" id="qrCaption" data-i18n-ph="qrCaptionPh" autocomplete="off">
            <p class="hint" data-i18n="qrCaptionHint"></p>
          </div>
          <div class="row2">
            <div>
              <label for="qrSize" data-i18n="size"></label>
              <select id="qrSize">
                <option value="256">256 px</option>
                <option value="512" selected>512 px</option>
                <option value="1024">1024 px</option>
                <option value="2048">2048 px</option>
              </select>
            </div>
            <div>
              <label for="qrEc" data-i18n="ecLevel"></label>
              <select id="qrEc">
                <option value="L">L — 7%</option>
                <option value="M" selected>M — 15%</option>
                <option value="Q">Q — 25%</option>
                <option value="H">H — 30%</option>
              </select>
            </div>
          </div>
          <p class="hint" data-i18n="ecHint"></p>
        </div>
      </div>

      <div class="preview-col">
        <div class="preview-box" id="qrPreviewBox">
          <div class="qr-wrap" id="qrWrap" style="display:none">
            <canvas id="qrCanvas" width="232" height="232"></canvas>
            <div class="qr-caption" id="qrCaptionPreview" style="display:none"></div>
          </div>
          <div class="placeholder" id="qrPlaceholder" data-i18n="qrPlaceholder"></div>
        </div>
        <div class="msg" id="qrMsg" role="status"></div>
        <div class="dl-row">
          <button class="btn" id="qrPng" disabled>PNG</button>
          <button class="btn secondary" id="qrSvg" disabled>SVG</button>
        </div>
        <div class="payload" id="qrPayload"></div>
      </div>
    </div>
  </section>

  <!-- ============ BARCODE ============ -->
  <section class="panel" id="bcPanel">
    <div class="cols">
      <div>
        <div class="pills" id="bcFormatPills"></div>
        <label for="bcValue" data-i18n="fValue"></label>
        <input type="text" id="bcValue" autocomplete="off" spellcheck="false">
        <p class="hint" id="bcHint"></p>

        <div class="settings">
          <h3 data-i18n="design"></h3>
          <div class="color-row">
            <div class="color-field">
              <label for="bcFg" data-i18n="fgColor"></label>
              <input type="color" id="bcFg" value="#1a1d21">
            </div>
            <div class="color-field">
              <label for="bcBg" data-i18n="bgColor"></label>
              <input type="color" id="bcBg" value="#ffffff">
            </div>
          </div>
          <label class="check"><input type="checkbox" id="bcBgTrans"><span data-i18n="transparent"></span></label>
          <label for="bcBarW"><span data-i18n="barWidth"></span> <span class="range-val" id="bcBarWVal"></span></label>
          <input type="range" id="bcBarW" min="1" max="4" step="0.5" value="2">
          <label for="bcHeight"><span data-i18n="barHeight"></span> <span class="range-val" id="bcHeightVal"></span></label>
          <input type="range" id="bcHeight" min="40" max="140" step="5" value="80">
          <label class="check"><input type="checkbox" id="bcShowVal" checked><span data-i18n="showValue"></span></label>
        </div>
      </div>

      <div class="preview-col">
        <div class="preview-box" id="bcPreviewBox">
          <svg id="bcSvg" xmlns="http://www.w3.org/2000/svg" style="display:none"></svg>
          <div class="placeholder" id="bcPlaceholder" data-i18n="bcPlaceholder"></div>
        </div>
        <div class="msg" id="bcMsg" role="status"></div>
        <div class="dl-row">
          <button class="btn" id="bcPng" disabled>PNG</button>
          <button class="btn secondary" id="bcSvgBtn" disabled>SVG</button>
        </div>
        <div class="payload" id="bcPayload"></div>
      </div>
    </div>
  </section>

  <!-- ============ BULK & LABELS ============ -->
  <section class="panel" id="bulkPanel">
    <div class="cols">
      <div>
        <h3 class="bulk-h" data-i18n="bulkDataTitle"></h3>
        <label for="bulkCsv" data-i18n="bulkCsvLabel"></label>
        <textarea id="bulkCsv" data-i18n-ph="bulkCsvPh" rows="8" spellcheck="false"></textarea>
        <p class="hint" data-i18n="bulkCsvHint"></p>
        <label for="bulkFile" data-i18n="bulkFileLabel"></label>
        <input type="file" id="bulkFile" accept=".csv,.tsv,.txt,text/csv,text/plain">

        <div class="settings">
          <h3 data-i18n="seqTitle"></h3>
          <div class="row2">
            <div><label for="seqPrefix" data-i18n="seqPrefix"></label><input type="text" id="seqPrefix" autocomplete="off" placeholder="ITEM-"></div>
            <div><label for="seqSuffix" data-i18n="seqSuffix"></label><input type="text" id="seqSuffix" autocomplete="off"></div>
          </div>
          <div class="row2">
            <div><label for="seqStart" data-i18n="seqStart"></label><input type="number" id="seqStart" value="1"></div>
            <div><label for="seqCount" data-i18n="seqCount"></label><input type="number" id="seqCount" value="24" min="1" max="200"></div>
          </div>
          <label for="seqPad" data-i18n="seqPad"></label>
          <input type="number" id="seqPad" value="4" min="0" max="12">
          <div class="dl-row">
            <button class="btn secondary" id="seqMake" data-i18n="seqMake"></button>
          </div>
        </div>

        <div class="settings">
          <h3 data-i18n="design"></h3>
          <label for="bulkKind" data-i18n="bulkKindLabel"></label>
          <select id="bulkKind">
            <option value="qr" data-i18n="kindQr"></option>
            <option value="barcode" data-i18n="kindBarcode"></option>
          </select>
          <div id="bulkBcOpts" style="display:none">
            <label for="bulkFormat" data-i18n="bulkFormatLabel"></label>
            <select id="bulkFormat"></select>
          </div>
          <div id="bulkQrOpts">
            <div class="row2">
              <div>
                <label for="bulkSize" data-i18n="size"></label>
                <select id="bulkSize">
                  <option value="256">256 px</option>
                  <option value="512" selected>512 px</option>
                  <option value="1024">1024 px</option>
                </select>
              </div>
              <div>
                <label for="bulkEc" data-i18n="ecLevel"></label>
                <select id="bulkEc">
                  <option value="L">L — 7%</option>
                  <option value="M" selected>M — 15%</option>
                  <option value="Q">Q — 25%</option>
                  <option value="H">H — 30%</option>
                </select>
              </div>
            </div>
          </div>
          <div class="color-row">
            <div class="color-field">
              <label for="bulkFg" data-i18n="fgColor"></label>
              <input type="color" id="bulkFg" value="#1a1d21">
            </div>
            <div class="color-field">
              <label for="bulkBg" data-i18n="bgColor"></label>
              <input type="color" id="bulkBg" value="#ffffff">
            </div>
          </div>
          <label class="check"><input type="checkbox" id="bulkBgTrans"><span data-i18n="transparent"></span></label>
          <label class="check"><input type="checkbox" id="bulkCaption" checked><span data-i18n="bulkCaption"></span></label>
        </div>
      </div>

      <div>
        <h3 class="bulk-h" data-i18n="bulkListTitle"></h3>
        <div class="hint" id="bulkSummary"></div>
        <div class="bulk-table-wrap" id="bulkTableWrap"></div>
        <div class="msg" id="bulkMsg" role="status"></div>
        <div class="dl-row">
          <button class="btn" id="bulkZipPng" disabled data-i18n="bulkZipPng"></button>
          <button class="btn secondary" id="bulkZipSvg" disabled data-i18n="bulkZipSvg"></button>
        </div>

        <div class="settings">
          <h3 data-i18n="sheetTitle"></h3>
          <label for="sheetPreset" data-i18n="sheetPreset"></label>
          <select id="sheetPreset">
            <option value="p12">12 — 86 × 42 mm (2 × 6)</option>
            <option value="p24" selected>24 — 64 × 33 mm (3 × 8)</option>
            <option value="p40">40 — 48 × 25 mm (4 × 10)</option>
            <option value="p65">65 — 38 × 20.5 mm (5 × 13)</option>
          </select>
          <div class="row2">
            <div>
              <label for="sheetText" data-i18n="sheetText"></label>
              <select id="sheetText">
                <option value="label" data-i18n="srcLabel"></option>
                <option value="value" data-i18n="srcValue"></option>
                <option value="none" data-i18n="srcNone"></option>
              </select>
            </div>
            <div>
              <label for="sheetOffset" data-i18n="sheetOffset"></label>
              <input type="number" id="sheetOffset" value="0" min="0" max="500">
            </div>
          </div>
          <div class="dl-row">
            <button class="btn" id="sheetMake" disabled data-i18n="sheetMake"></button>
          </div>
          <div class="dl-row">
            <button class="btn secondary" id="sheetPngZip" disabled data-i18n="sheetPngZip"></button>
          </div>
          <p class="hint" data-i18n="sheetHint"></p>
        </div>
      </div>
    </div>
    <div id="sheetArea"></div>
    <div id="bulkHidden" style="display:none"></div>
  </section>

  <footer data-i18n="footerNote"></footer>
  <div class="copyright">© 2026 Koichi Uemura · MIT License</div>
  <div class="trademark" data-i18n="trademark"></div>
</main>

    const fKeys = ['filename', 'file', 'ファイル名', 'ชื่อไฟล์'];
    const vi = head.findIndex(h => vKeys.includes(h));
    if (vi >= 0) {
      idx = { v: vi, l: head.findIndex(h => lKeys.includes(h)), f: head.findIndex(h => fKeys.includes(h)) };
      startIdx = 1;
    }
  }
  bulkRows = [];
  const used = {};
  for (let i = startIdx; i < parsed.length && bulkRows.length < BULK_MAX; i++) {
    const cells = parsed[i];
    const value = String(cells[idx.v] != null ? cells[idx.v] : '').trim();
    if (!value) continue;
    const label = idx.l >= 0 ? String(cells[idx.l] != null ? cells[idx.l] : '').trim() : '';
    let fn = sanitizeFilename(idx.f >= 0 ? String(cells[idx.f] != null ? cells[idx.f] : '').trim() : '', 'code-' + String(bulkRows.length + 1).padStart(3, '0'));
    if (used[fn]) fn = fn + '-' + (bulkRows.length + 1);
    used[fn] = 1;
    const chk = validateBulkRow(value);
    bulkRows.push({ value: value, label: label, filename: fn, enc: chk.enc || '', error: chk.error || '' });
  }
  renderBulkTable();
  lastSheets = [];
  $('sheetArea').innerHTML = '';
}
function renderBulkTable() {
  const wrap = $('bulkTableWrap');
  const ok = bulkRows.filter(r => !r.error).length;
  const ng = bulkRows.length - ok;
  $('bulkSummary').textContent = bulkRows.length ? t.bulkSummary(ok, ng, bulkRows.length) : t.bulkEmpty;
  $('bulkZipPng').disabled = !ok;
  $('bulkZipSvg').disabled = !ok;
  $('sheetMake').disabled = !ok;
  $('sheetPngZip').disabled = true;
  if (!bulkRows.length) { wrap.innerHTML = ''; return; }
  const tbl = document.createElement('table');
  tbl.className = 'bulk';
  const thead = document.createElement('tr');
  [t.colRow, t.colValue, t.colLabel, t.colFile, t.colStatus].forEach(h => {
    const th = document.createElement('th'); th.textContent = h; thead.appendChild(th);
  });
  tbl.appendChild(thead);
  bulkRows.forEach((r, i) => {
    const tr = document.createElement('tr');
    const vals = [String(i + 1), r.value, r.label, r.filename];
    vals.forEach((v, j) => {
      const td = document.createElement('td');
      if (j === 1) td.className = 'v';
      td.textContent = v;
      tr.appendChild(td);
    });
    const td = document.createElement('td');
    td.textContent = r.error ? r.error : t.stOk;
    td.className = r.error ? 'st-bad' : 'st-ok';
    tr.appendChild(td);
    tbl.appendChild(tr);
  });
  wrap.innerHTML = '';
  wrap.appendChild(tbl);
}

/* ----- per-row renderers (bulk settings) ----- */
function bulkQrCanvas(text, size) {
  return new Promise(res => {
    const c = document.createElement('canvas');
    QRCode.toCanvas(c, text, {
      width: size, margin: 4, errorCorrectionLevel: $('bulkEc').value,
      color: { dark: $('bulkFg').value, light: $('bulkBgTrans').checked ? '#00000000' : $('bulkBg').value }
    }, err => res(err ? null : c));
  });
}
async function bulkQrPng(row, size, withCaption) {
  const c = await bulkQrCanvas(row.enc, size);
  if (!c) return null;
  const label = withCaption ? (row.label || row.value) : '';
  if (!label) return c.toDataURL('image/png');
  const fontSize = Math.max(16, Math.round(size * 0.046));
  const lh = Math.round(fontSize * 1.35);
  const padTop = Math.round(size * 0.015), padBottom = Math.round(size * 0.045), padX = Math.round(size * 0.05);
  const meas = document.createElement('canvas').getContext('2d');
  meas.font = '500 ' + fontSize + 'px system-ui, -apple-system, "Segoe UI", sans-serif';
  const lines = wrapLinesCanvas(meas, label, size - padX * 2, 3);
  if (!lines.length) return c.toDataURL('image/png');
  const out = document.createElement('canvas');
  out.width = size; out.height = size + padTop + lines.length * lh + padBottom;
  const ctx = out.getContext('2d');
  if (!$('bulkBgTrans').checked) { ctx.fillStyle = $('bulkBg').value; ctx.fillRect(0, 0, out.width, out.height); }
  ctx.drawImage(c, 0, 0);
  ctx.fillStyle = $('bulkFg').value;
  ctx.font = meas.font; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  lines.forEach((ln, i) => ctx.fillText(ln, size / 2, size + padTop + i * lh));
  return out.toDataURL('image/png');
}
function bulkQrSvg(row) {
  return new Promise(res => {
    QRCode.toString(row.enc, {
      type: 'svg', margin: 4, errorCorrectionLevel: $('bulkEc').value,
      color: { dark: $('bulkFg').value, light: $('bulkBgTrans').checked ? '#00000000' : $('bulkBg').value }
    }, (err, svg) => res(err ? null : svg));
  });
}
function bulkBcOpts() {
  return {
    format: $('bulkFormat').value,
    lineColor: $('bulkFg').value,
    background: $('bulkBgTrans').checked ? 'transparent' : $('bulkBg').value,
    width: 2, height: 80, displayValue: true, fontSize: 16, margin: 10
  };
}
function bulkBcCanvas(row) {
  const c = document.createElement('canvas');
  JsBarcode(c, row.enc, bulkBcOpts());
  const big = document.createElement('canvas');
  big.width = c.width * 2; big.height = c.height * 2;
  const ctx = big.getContext('2d');
  if (!$('bulkBgTrans').checked) { ctx.fillStyle = $('bulkBg').value; ctx.fillRect(0, 0, big.width, big.height); }
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(c, 0, 0, big.width, big.height);
  return big;
}
function bulkBcSvg(row) {
  const host = $('bulkHidden');
  host.innerHTML = '';
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  host.appendChild(svg);
  JsBarcode(svg, row.enc, bulkBcOpts());
  svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  const txt = new XMLSerializer().serializeToString(svg);
  host.innerHTML = '';
  return txt;
}
function dataURLBytes(u) {
  const b = atob(String(u).split(',')[1]);
  const arr = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) arr[i] = b.charCodeAt(i);
  return arr;
}

/* ----- minimal ZIP writer (store only) ----- */
const CRC_TABLE = (() => {
  const tbl = new Int32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    tbl[n] = c;
  }
  return tbl;
})();
function crc32(u8) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function makeZip(files) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  const d = new Date();
  const dosTime = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
  const dosDate = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
  files.forEach(f => {
    const name = enc.encode(f.name);
    const crc = crc32(f.data);
    const size = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true); lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true); ch.setUint16(12, dosTime, true);
    ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true); ch.setUint32(20, size, true);
    ch.setUint32(24, size, true); ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + size;
  });
  let cdSize = 0;
  central.forEach(p => { cdSize += p.length; });
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(8, files.length, true); eocd.setUint16(10, files.length, true);
  eocd.setUint32(12, cdSize, true); eocd.setUint32(16, offset, true);
  return new Blob(parts.concat(central, [new Uint8Array(eocd.buffer)]), { type: 'application/zip' });
}
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  downloadURI(url, name);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

async function bulkExport(kind) {
  const rows = bulkRows.filter(r => !r.error);
  if (!rows.length) { setMsg($('bulkMsg'), t.bulkZipEmpty, 'error'); return; }
  const btn = kind === 'png' ? $('bulkZipPng') : $('bulkZipSvg');
  btn.disabled = true;
  const files = [];
  try {
    for (let i = 0; i < rows.length; i++) {
      setMsg($('bulkMsg'), t.bulkBusy(i + 1, rows.length), '');
      await new Promise(r => setTimeout(r, 0));
      const row = rows[i];
      if (bulkKind() === 'qr') {
        if (kind === 'png') {
          const u = await bulkQrPng(row, parseInt($('bulkSize').value, 10), $('bulkCaption').checked);
          if (u) files.push({ name: row.filename + '.png', data: dataURLBytes(u) });
        } else {
          const s = await bulkQrSvg(row);
          if (s) files.push({ name: row.filename + '.svg', data: new TextEncoder().encode(s) });
        }
      } else {
        if (kind === 'png') files.push({ name: row.filename + '.png', data: dataURLBytes(bulkBcCanvas(row).toDataURL('image/png')) });
        else files.push({ name: row.filename + '.svg', data: new TextEncoder().encode(bulkBcSvg(row)) });
      }
    }
    if (!files.length) throw new Error('empty');
    downloadBlob(makeZip(files), kind === 'png' ? 'codes-png.zip' : 'codes-svg.zip');
    setMsg($('bulkMsg'), t.bulkDone(files.length), 'note');
  } catch (e) {
    setMsg($('bulkMsg'), t.errQrFailed, 'error');
  }
  btn.disabled = false;
}

/* ----- A4 label sheet ----- */
const SHEET_PRESETS = {
  p12: { cols: 2, rows: 6, w: 86, h: 42, gx: 6, gy: 6 },
  p24: { cols: 3, rows: 8, w: 64, h: 33, gx: 4, gy: 3 },
  p40: { cols: 4, rows: 10, w: 48, h: 25, gx: 3, gy: 2 },
  p65: { cols: 5, rows: 13, w: 38, h: 20.5, gx: 2, gy: 2 }
};
async function bulkCodeImageURL(row) {
  if (bulkKind() === 'qr') return await bulkQrPng(row, 320, false);
  return bulkBcCanvas(row).toDataURL('image/png');
}
async function buildSheet() {
  const rows = bulkRows.filter(r => !r.error);
  if (!rows.length) { setMsg($('bulkMsg'), t.bulkZipEmpty, 'error'); return; }
  $('sheetMake').disabled = true;
  try {
    const P = SHEET_PRESETS[$('sheetPreset').value];
    const per = P.cols * P.rows;
    const totalW = P.cols * P.w + (P.cols - 1) * P.gx;
    const totalH = P.rows * P.h + (P.rows - 1) * P.gy;
    const mx = (210 - totalW) / 2, my = (297 - totalH) / 2;
    const offset = Math.max(0, parseInt($('sheetOffset').value, 10) || 0);
    const slots = [];
    for (let i = 0; i < offset; i++) slots.push(null);
    rows.forEach(r => slots.push(r));
    lastSheets = [];
    const area = $('sheetArea');
    area.innerHTML = '';
    const srcMode = $('sheetText').value;
    for (let p = 0; p < slots.length; p += per) {
      const pageSlots = slots.slice(p, p + per);
      const sheet = document.createElement('div');
      sheet.className = 'sheet';
      const cells = [];
      for (let i = 0; i < per; i++) {
        const col = i % P.cols, rowI = Math.floor(i / P.cols);
        const x = mx + col * (P.w + P.gx), y = my + rowI * (P.h + P.gy);
        const cell = document.createElement('div');
        cell.className = 'sheet-cell';
        cell.style.left = (x / 210 * 100) + '%';
        cell.style.top = (y / 297 * 100) + '%';
        cell.style.width = (P.w / 210 * 100) + '%';
        cell.style.height = (P.h / 297 * 100) + '%';
        const r = pageSlots[i] || null;
        let capText = '';
        if (r) {
          capText = srcMode === 'label' ? (r.label || r.value) : srcMode === 'value' ? r.value : '';
          const imgUrl = await bulkCodeImageURL(r);
          if (imgUrl) {
            const wrapEl = document.createElement('div');
            wrapEl.className = 'imgwrap';
            const img = document.createElement('img');
            img.src = imgUrl; img.alt = r.value;
            wrapEl.appendChild(img);
            cell.appendChild(wrapEl);
          }
          if (capText) {
            const cap = document.createElement('div');
            cap.className = 'cap'; cap.textContent = capText;
            cell.appendChild(cap);
          }
        }
        cells.push({ row: r, x: x, y: y, w: P.w, h: P.h, cap: capText });
        sheet.appendChild(cell);
      }
      lastSheets.push(cells);
      const scroll = document.createElement('div');
      scroll.className = 'sheet-scroll';
      scroll.appendChild(sheet);
      area.appendChild(scroll);
    }
    $('sheetPngZip').disabled = false;
    setMsg($('bulkMsg'), t.sheetDone(lastSheets.length), 'note');
  } catch (e) {
    setMsg($('bulkMsg'), t.errQrFailed, 'error');
  }
  $('sheetMake').disabled = false;
}
function loadImg(url) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => res(null);
    im.src = url;
  });
}
async function sheetPngZip() {
  if (!lastSheets.length) return;
  const btn = $('sheetPngZip');
  btn.disabled = true;
  try {
    const files = [];
    const scale = 300 / 25.4;
    const W = Math.round(210 * scale), H = Math.round(297 * scale);
    for (let p = 0; p < lastSheets.length; p++) {
      setMsg($('bulkMsg'), t.bulkBusy(p + 1, lastSheets.length), '');
      await new Promise(r => setTimeout(r, 0));
      const cvs = document.createElement('canvas');
      cvs.width = W; cvs.height = H;
      const ctx = cvs.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
      for (const cell of lastSheets[p]) {
        if (!cell.row) continue;
        const url = bulkKind() === 'qr' ? await bulkQrPng(cell.row, 512, false) : bulkBcCanvas(cell.row).toDataURL('image/png');
        const img = url ? await loadImg(url) : null;
        if (!img) continue;
        const x = cell.x * scale, y = cell.y * scale, w = cell.w * scale, h = cell.h * scale;
        const capH = cell.cap ? h * 0.24 : 0;
        const codeH = h - capH, pad = w * 0.06;
        const s = Math.min((w - pad * 2) / img.width, Math.max(1, codeH - pad) / img.height);
        const dw = img.width * s, dh = img.height * s;
        ctx.drawImage(img, x + (w - dw) / 2, y + (codeH - dh) / 2, dw, dh);
        if (cell.cap) {
          ctx.fillStyle = '#111111';
          ctx.font = '600 ' + Math.max(20, Math.round(h * 0.115)) + 'px system-ui, -apple-system, "Segoe UI", sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          const txt = cell.cap.length > 44 ? cell.cap.slice(0, 44) + '…' : cell.cap;
          ctx.fillText(txt, x + w / 2, y + codeH + capH / 2, w - pad);
        }
      }
      files.push({ name: 'label-sheet-' + (p + 1) + '.png', data: dataURLBytes(cvs.toDataURL('image/png')) });
    }
    downloadBlob(makeZip(files), 'label-sheets.zip');
    setMsg($('bulkMsg'), t.bulkDone(files.length), 'note');
  } catch (e) {
    setMsg($('bulkMsg'), t.errQrFailed, 'error');
  }
  btn.disabled = false;
}

/* ----- bulk wiring ----- */
$('seqMake').onclick = () => {
  const prefix = $('seqPrefix').value, suffix = $('seqSuffix').value;
  const start = parseInt($('seqStart').value, 10) || 0;
  const count = Math.min(BULK_MAX, Math.max(1, parseInt($('seqCount').value, 10) || 1));
  const pad = Math.min(12, Math.max(0, parseInt($('seqPad').value, 10) || 0));
  const lines = [];
  for (let i = 0; i < count; i++) {
    const v = prefix + String(start + i).padStart(pad, '0') + suffix;
    lines.push(csvEscape(v) + ',' + csvEscape(v));
  }
  $('bulkCsv').value = lines.join('\n');
  refreshBulk();
};
$('bulkFile').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  try { $('bulkCsv').value = await f.text(); refreshBulk(); } catch (err) {}
});
let bulkTimer;
$('bulkCsv').addEventListener('input', () => { clearTimeout(bulkTimer); bulkTimer = setTimeout(refreshBulk, 200); });
['bulkKind', 'bulkFormat', 'bulkEc'].forEach(id => $(id).addEventListener('change', refreshBulk));
$('bulkBgTrans').addEventListener('change', () => { $('bulkBg').disabled = $('bulkBgTrans').checked; });
$('bulkZipPng').onclick = () => bulkExport('png');
$('bulkZipSvg').onclick = () => bulkExport('svg');
$('sheetMake').onclick = buildSheet;
$('sheetPngZip').onclick = sheetPngZip;

/* ---------- pills, wiring, i18n ---------- */
function buildPills() {
  const qp = $('qrTypePills'); qp.innerHTML = '';
  QR_TYPES.forEach(type => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'pill' + (type === qrType ? ' active' : '');
    b.textContent = t.qrTypes[type];
    b.onclick = () => {
      qrType = type;
      document.querySelectorAll('#qrPanel .form').forEach(f => f.classList.remove('active'));
      $('form-' + type).classList.add('active');
      buildPills(); renderQR();
    };
    qp.appendChild(b);
  });
  const bp = $('bcFormatPills'); bp.innerHTML = '';
  Object.keys(t.bcFormats).forEach(fmt => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'pill' + (fmt === bcFormat ? ' active' : '');
    b.textContent = t.bcFormats[fmt];
    b.onclick = () => { bcFormat = fmt; buildPills(); renderBC(); };
    bp.appendChild(b);
  });
}
let qrTimer, bcTimer;
document.querySelectorAll('#qrPanel input, #qrPanel textarea, #qrPanel select').forEach(el => {
  el.addEventListener('input', () => { clearTimeout(qrTimer); qrTimer = setTimeout(renderQR, 120); });
  el.addEventListener('change', renderQR);
});
document.querySelectorAll('#bcPanel input, #bcPanel select').forEach(el => {
  el.addEventListener('input', () => { clearTimeout(bcTimer); bcTimer = setTimeout(renderBC, 120); });
  el.addEventListener('change', renderBC);
});
$('qrBgTrans').addEventListener('change', () => { $('qrBg').disabled = $('qrBgTrans').checked; renderQR(); });
$('bcBgTrans').addEventListener('change', () => { $('bcBg').disabled = $('bcBgTrans').checked; renderBC(); });

function applyLang() {
  document.title = t.title;
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n] || ''; });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t[el.dataset.i18nPh] || ''; });
  $('langEn').classList.toggle('active', LANG === 'en');
  $('langJa').classList.toggle('active', LANG === 'ja');
  $('langTh').classList.toggle('active', LANG === 'th');
  buildPills(); renderQR(); renderBC(); refreshBulk();
}
function setLang(next) {
  LANG = next; t = I18N[LANG];
  try { localStorage.setItem(LANG_STORAGE_KEY, LANG); } catch (e) {}
  applyLang();
}
$('langEn').onclick = () => setLang('en');
$('langJa').onclick = () => setLang('ja');
$('langTh').onclick = () => setLang('th');
applyLang();
